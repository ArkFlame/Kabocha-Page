name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege required by the official GitHub Pages artifact deployment flow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Normalize Pages URL for HTTPS deployment
        id: site
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node --input-type=module <<'NODE'
          const site = new URL(process.env.PAGES_ORIGIN);
          // configure-pages can report http while the custom-domain certificate is provisioning.
          site.protocol = 'https:';
          const base = process.env.PAGES_BASE_PATH || '/';
          if (base !== '/' && !base.startsWith('/')) throw new Error('Invalid Pages base path: ' + base);
          const outputs = [
            ['site', site.origin],
            ['base', base],
          ];
          for (const [name, value] of outputs) {
            const line = name + '=' + value;
            process.stdout.write(line + '\n');
            await import('node:fs/promises').then(({ appendFile }) => appendFile(process.env.GITHUB_OUTPUT, line + '\n'));
          }
          await import('node:fs/promises').then(({ appendFile }) => appendFile(process.env.GITHUB_STEP_SUMMARY,
            'Pages origin: ' + site.origin + '\n\nPages base path: ' + base + '\n'));
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Derived from configure-pages so root deployments never inherit a repository path.
          PUBLIC_SITE_URL: ${{ steps.site.outputs.site }}
          PUBLIC_BASE_PATH: ${{ steps.site.outputs.base }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
